{% set name = "libcups" %}
{% set version = "2.4.20" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/OpenPrinting/cups/releases/download/v{{ version }}/cups-{{ version }}-source.tar.gz
  sha256: ab4d9cd7f3e58060091d2b24972223d6401675f11c49b65abf4f6ef31dea22ff
  patches:
    # https://github.com/OpenPrinting/cups/commit/23a183b63a4c94ae7cd0f36c63ee7eb905be60fd
    - 0001-fix-enumeration-without-dnssd.patch

build:
  number: 0
  skip: true  # [not linux]
  run_exports:
    # Public APIs are binary compatible across minor releases (DEVELOPING.md).
    - {{ pin_subpackage('libcups', max_pin='x') }}

requirements:
  build:
    - {{ stdlib('c') }}
    - gnuconfig  # [unix]
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - make
    - pkg-config
  host:
    - krb5
    - openssl
    - zlib

test:
  requires:
    - {{ compiler('c') }}
    - pkg-config
  commands:
    - test -f ${PREFIX}/lib/libcups${SHLIB_EXT}   # [unix]
    - test -f ${PREFIX}/include/cups/cups.h       # [unix]
    - test -f ${PREFIX}/lib/libcups.so.2
    - test -f ${PREFIX}/lib/pkgconfig/cups.pc
    - cups-config --version
    - ipptool --version

about:
  home: https://openprinting.github.io/cups/
  license:  Apache-2.0
  license_family: Apache
  license_file:
    - LICENSE
    - NOTICE
  summary: CUPS is the standards-based, open source printing system
  description: |
    CUPS is the standards-based, open source printing system maintained by
    OpenPrinting for Linux and other UNIX-like operating systems. CUPS uses the Internet
    Printing Protocol (IPP) to support printing to local and network printers.
  doc_url: https://openprinting.github.io/cups/#documentation
  dev_url: https://github.com/OpenPrinting/cups

extra:
  recipe-maintainers:
    - isuruf
    - hmaarrfk
